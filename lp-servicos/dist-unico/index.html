    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Agência JVI — Landing Page, Tráfego Pago e Social Mídia</title>
    <meta
      name="description"
      content="As três frentes que tiram a sua marca da dependência do boca a boca: landing pages que convertem, tráfego pago gerido com dados e social mídia que constrói autoridade. Agência JVI, Recife/PE."
    />
    <link rel="canonical" href="https://agenciajvi.com.br/servicos" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

      property="og:description"
      content="Três frentes, um sistema de vendas. Do boca a boca ao digital."
    />
    <meta property="og:image" content="/art/hero.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fontes auto-hospedadas: zero dependência externa, zero FOUT de terceiros -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/anton-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/oswald-500-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Agência JVI",
        "description": "Agência de marketing digital e performance especializada em landing pages, tráfego pago e social mídia.",
        "email": "somosagenciajvi@gmail.com",
        "telephone": "+55 81 99575-7305",
        "areaServed": "BR",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Recife",
          "addressRegion": "PE",
          "addressCountry": "BR"
        },
        "sameAs": ["https://instagram.com/agencia.jvi"],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Serviços",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Criação de Landing Page",
                "description": "Página de conversão com copy, design exclusivo, desenvolvimento próprio e rastreamento configurado."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Tráfego Pago",
                "description": "Gestão de campanhas em Meta Ads e Google Ads com estruturação de conta, criativos e otimização por dados."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Social Mídia",
                "description": "Linha editorial, direção de arte, roteiro e edição de conteúdo para construir autoridade de marca."
              }
            }
          ]
        }
      }
    </script>
    <!-- Object.hasOwn é de 2022 e o bundle usa: em aparelho mais antigo
         a ausência derruba o React e a página fica preta. Três linhas
         resolvem, e o navegador atual ignora. -->
    <script>
      Object.hasOwn ||
        (Object.hasOwn = function (o, k) {
          return Object.prototype.hasOwnProperty.call(o, k)
        })
    </script>
    <script type="module" crossorigin src="/assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/app.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
